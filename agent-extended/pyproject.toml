[tool.poetry]
name = "gpt_agent"
version = "0.1"
description = ""
authors = []
readme = "README.md"
packages = [{ include = "gpt_agent" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "~=0.103"
uvicorn = "~=0.23"
aiofiles = "~=23.2"
langchain = "~=0.0"
langchain-community = "~=0.0"
openai = "~=1.7"
httpx = "~=0.24"
python-dotenv = "~=1.0"
sse-starlette = "^1.8.1"
python-jose = "^3.3.0"
jinja2 = "^3.1.2"
pytest = "8.4.1"


[tool.poetry.group.dev.dependencies]
pytest = "~=7.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "-------- %(asctime)s [%(levelname)8s] (%(filename)s:%(lineno)s) %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"